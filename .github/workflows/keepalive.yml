name: Keep backend awake

# Some free hosting tiers pause idle projects; a weekly ping keeps the test API available.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl -fsS "${{ vars.API_URL }}/health"
